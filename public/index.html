<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>📈 Stock Market App</h1>

    <div class="search-box">

        <input 
            type="text" 
            id="symbolInput"
            placeholder="Enter stock symbol"
        >

        <button id="searchBtn">
            Search
        </button>

    </div>

    <div class="examples">

        <p>Popular Search</p>

        <button>AAPL</button>
        <button>TSLA</button>
        <button>MSFT</button>
        <button>GOOGL</button>
        <button>AMZN</button>
        <button>NVDA</button>
        <button>META</button>
        <button>NFLX</button>

    </div>

    <div class="dashboard">
        <div id="stockContainer"></div>
        <div id="chartContainer"></div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script src="app.js"></script>
   

</body>
</html>
